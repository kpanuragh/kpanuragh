, monospace" font-size="13" fill="#e6edf3">DEFLATE / compression</text><rect x="906" y="192" width="54" height="26" rx="3" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/><text x="933" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#22d3ee" text-anchor="middle">zlib</text><animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45" keyTimes="0;0.375;0.425;0.475;1" dur="12s" repeatCount="indefinite"/></g><g><line x1="92" y1="250" x2="960" y2="250" stroke="#1e293b" stroke-width="1"/><circle cx="74" cy="250" r="4" fill="#22d3ee"/><text x="104" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#e6edf3">Wayland / FreeDesktop spec</text><rect x="874" y="236" width="86" height="26" rx="3" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/><text x="917" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#22d3ee" text-anchor="middle">swaynoti</text><animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45" keyTimes="0;0.5;0.55;0.6;1" dur="12s" repeatCount="indefinite"/></g><g><line x1="92" y1="294" x2="960" y2="294" stroke="#1e293b" stroke-width="1"/><circle cx="74" cy="294" r="4" fill="#22d3ee"/><text x="104" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#e6edf3">syscalls / terminal</text><rect x="890" y="280" width="70" height="26" rx="3" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/><text x="925" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#22d3ee" text-anchor="middle">tui-db</text><animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45" keyTimes="0;0.625;0.675;0.725;1" dur="12s" repeatCount="indefinite"/></g><g><line x1="92" y1="338" x2="96