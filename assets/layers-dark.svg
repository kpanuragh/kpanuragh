<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The stack from React and Laravel down to silicon, annotated with the project built at each depth: xdebug-mcp at the DBGp wire protocol, zlib at DEFLATE, swaynoti at the Wayland spec, tui-db at syscalls, myos at the bootloader.">
