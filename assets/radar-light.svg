<circle cx="201.0" cy="101.4" r="3.5" fill="#b45309" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.08;1" dur="6s" begin="0.58s" repeatCount="indefinite"/></circle><circle cx="263.9" cy="163.6" r="3.5" fill="#b45309" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.08;1" dur="6s" begin="1.53s" repeatCount="indefinite"/></circle><circle cx="177.0" cy="202.2" r="3.5" fill="#b45309" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.08;1" dur="6s" begin="2.63s" repeatCount="indefinite"/></circle><circle cx="91.3" cy="215.6" r="3.5" fill="#b45309" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.08;1" dur="6s" begin="3.85s" repeatCount="indefinite"/></circle><circle cx="107.1" cy="129.4" r="3.5" fill="#b45309" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.08;1" dur="6s" begin="5.00s" repeatCount="indefinite"/></circle>
<g>
