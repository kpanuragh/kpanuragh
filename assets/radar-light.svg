<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="A radar sweep with contacts appearing as the beam passes — a nod to decoding aircraft transponders with a software-defined radio. Receive only.">
