<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Each irritation and the tool written to remove it: notifications to swaynoti, launcher to wlaunch-rs, database client to tui-db, PHP debugging to xdebug-mcp, compression to zlib, and curiosity about the operating system to myos.">
<text x="40" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="11" fill="#59636e" letter-spacing="3">ANNOYANCE</text>
<text x="496" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="11" fill="#59636e" letter-spacing="3">WHAT I BUILT</text>
<g><text x="430" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#59636e" text-anchor="end">notifications looked wrong</text><line x1="440" y1="58" x2="476" y2="58" stroke="#d0d7de" stroke-width="1"/><polygon points="476,54 484,58 476,62" fill="#b45309"/><rect x="496" y="46" width="86" height="24" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-opacity="0.6"/><text x="539" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#0891b2" text-anchor="middle">swaynoti</text><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0;0.0667;0.1333;1" dur="14s" repeatCount="indefinite"/></g><g><text x="430" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#59636e" text-anchor="end">no launcher I liked</text><line x1="440" y1="90" x2="476" y2="90" stroke="#d0d7de" stroke-width="1"/><polygon points="476,86 484,90 476,94" fill="#b45309"/><rect x="496" y="78" width="102" height="24" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-opacity="0.6"/><text x="547" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#0891b2" text-anchor="middle">wlaunch-rs</text><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.1667;0.2333;0.3;1" dur="14s" repeatCount="indefinite"/></g><g><text x="430" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#59636e" text-anchor="end">DBeaver is too heavy</text><line x1="440" y1="122" x2="476" y2="122" stroke="#d0d7de" stroke-width="1"/><polygon points="476,118 484,122 476,126" fill="#b45309"/><rect x="496" y="110" width="70" height="24" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-opacity="0.6"/><text x="531" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#0891b2" text-anchor="middle">tui-db</text><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.3333;0.4;0.4667;1" dur="14s" repeatCount="indefinite"/></g><g><text x="430" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#59636e" text-anchor="end">an AI could not debug PHP</text><line x1="440" y1="154" x2="476" y2="154" stroke="#d0d7de" stroke-width="1"/><polygon points="476,150 484,154 476,158" fill="#b45309"/><rect x="496" y="142" width="102" height="24" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-opacity="0.6"/><text x="547" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#0891b2" text-anchor="middle">xdebug-mcp</text><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.5;0.5667;0.6333;1" dur="14s" repeatCount="indefinite"/></g><g><text x="430" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#59636e" text-anchor="end">zlib needed native bindings</text><line x1="440" y1="186" x2="476" y2="186" stroke="#d0d7de" stroke-width="1"/><polygon points="476,182 484,186 476,190" fill="#b45309"/><rect x="496" y="174" width="54" height="24" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-opacity="0.6"/><text x="523" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#0891b2" text-anchor="middle">zlib</text><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.6667;0.7333;0.8;1" dur="14s" repeatCount="indefinite"/></g><g><text x="430" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#59636e" text-anchor="end">what is under the OS?</text><line x1="440" y1="218" x2="476" y2="218" stroke="#d0d7de" stroke-width="1"/><polygon points="476,214 484,218 476,222" fill="#b45309"/><rect x="496" y="206" width="54" height="24" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-opacity="0.6"/><text x="523" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#0891b2" text-anchor="middle">myos</text><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.8333;0.9;0.9667;1" dur="14s" repeatCount="indefinite"/></g>
