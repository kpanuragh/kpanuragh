name: refresh stats

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bare `node --test` auto-discovers tests/. A glob argument needs Node 22+
      # and a bare directory argument breaks on Node 24, so neither is portable.
      - name: Run unit tests
        run: node --test

      - name: Regenerate statistics assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: kpanuragh
        run: node tools/generate-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: refresh profile stats"
          git push
